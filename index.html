<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gửi em, bé yêu của anh 🎁</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="aurora"></div>
<div id="stars"></div>
<div id="ambient"></div>

<button id="mute-btn" aria-label="Tắt/bật nhạc" title="Tắt/bật nhạc">🔊</button>

<main id="app">

  <!-- ================= 1. MỞ ĐẦU ================= -->
  <section id="screen-intro" class="screen active">
    <div class="intro-glow"></div>
    <p class="eyebrow">Suỵt...</p>
    <h1 class="title-script">Có một điều bất ngờ<br>đang chờ em</h1>
    <button id="start-btn" class="btn btn-primary">
      <span>Bắt đầu hành trình</span>
      <span class="btn-spark">✨</span>
    </button>
    <p class="scroll-hint">chạm để mở ra điều bí mật</p>
  </section>

  <!-- ================= 2. HỘP QUÀ BÍ MẬT ================= -->
  <section id="screen-gift" class="screen">
    <p class="eyebrow">Một món quà nhỏ đang đợi em</p>
    <h2 class="title-script">Kéo dây ruy băng để mở hộp quà nhé</h2>

    <div class="gift-stage" id="gift-stage">
      <div class="gift-box" id="gift-box">
        <div class="box-lid" id="box-lid">
          <div class="ribbon-v"></div>
          <div class="bow" id="bow">
            <span class="bow-loop bow-left"></span>
            <span class="bow-loop bow-right"></span>
            <span class="bow-knot"></span>
          </div>
        </div>
        <div class="box-body">
          <div class="ribbon-v ribbon-v-body"></div>
        </div>
        <div class="ribbon-tail" id="ribbon-tail">
          <div class="tail-grip">⬇</div>
        </div>
        <div class="glow-burst" id="glow-burst"></div>
      </div>
      <div class="sparkles" id="sparkles"></div>
    </div>

    <p class="hint" id="gift-hint">kéo sợi dây ruy băng xuống từ từ...</p>
  </section>

  <!-- ================= 3. CÁC NHÓM ẢNH (tự chạy như một đoạn phim) ================= -->
  <section id="screen-gallery" class="screen">
    <div class="story-stage" id="story-stage">
      <div class="caption-layer" id="caption-layer">
        <p class="caption-text" id="caption-text"></p>
      </div>
      <div class="photo-layer" id="photo-layer">
        <div class="photo-frame" id="photo-frame">
          <img class="photo-img" id="photo-current" src="" alt="">
        </div>
      </div>
      <div class="story-particles" id="story-particles"></div>
    </div>
  </section>

  <!-- ================= 4. LỜI CHÚC ================= -->
  <section id="screen-letter" class="screen">
    <div class="paper" id="paper">
      <div class="paper-inner">
        <div class="letter-heading">Gửi bé yêu của anh,</div>
        <div id="letter-text" class="letter-text"></div>
        <div class="letter-sign">— Anh yêu của bé —</div>
      </div>
    </div>
    <div class="letter-actions" id="letter-actions">
      <button id="replay-btn" class="btn btn-ghost">Đọc lại từ đầu</button>
      <button id="continue-btn" class="btn btn-primary btn-continue">Bé bấm tiếp nữa đi <span class="btn-spark">💛</span></button>
    </div>
  </section>

  <!-- ================= 5. KẾT — HAPPY BIRTHDAY ================= -->
  <section id="screen-ending" class="screen">
    <div class="ending-confetti" id="ending-confetti"></div>
    <div class="ending-balloons" id="ending-balloons"></div>
    <p class="ending-cake">🎂</p>
    <h1 class="title-script ending-title">Happy<br>Birthday</h1>
    <p class="subtitle ending-sub">Chúc mừng sinh nhật em, bé yêu của anh 💛<br>Mãi mãi bên em.</p>
  </section>

</main>

<!-- Nhạc nền -->
<audio id="audio-1" src="assets/audio/nhom1.mp3" loop preload="none"></audio>
<audio id="audio-2" src="assets/audio/nhom2.mp3" loop preload="none"></audio>
<audio id="audio-3" src="assets/audio/nhom3.mp3" loop preload="none"></audio>
<audio id="audio-romantic" src="assets/audio/romantic.mp3" loop preload="none"></audio>
<audio id="audio-ending" src="assets/audio/happy-birthday.mp3" loop preload="none"></audio>

<script src="assets/js/script.js"></script>
</body>
</html>
